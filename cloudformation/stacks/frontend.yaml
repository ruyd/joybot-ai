AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  JoyBot frontend (plan.md §8.3): private site bucket behind CloudFront (origin access control),
  /api/* to the internal ALB through a CloudFront VPC origin (no public API endpoint), SPA routing,
  security headers, optional WAF and custom domain, and the web assets custom resource.

Parameters:
  EnvironmentName:
    Type: String
    AllowedValues: [dev, staging, prod]
  AlbArn:
    Type: String
  AlbDnsName:
    Type: String
  DomainName:
    Type: String
    Default: ""
    Description: Optional custom domain, e.g. app.example.com (needs HostedZoneId and a us-east-1 certificate).
  HostedZoneId:
    Type: String
    Default: ""
  CertificateArn:
    Type: String
    Default: ""
  EnableWaf:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  ApiRateLimitPer5Min:
    Type: Number
    Default: 2000
    MinValue: 100
    Description: Requests to /api/* per client IP per 5 minutes before blocking.
  CustomersUserPoolId:
    Type: String
  CustomersClientId:
    Type: String
  CustomersLoginDomain:
    Type: String
  EmployeesUserPoolId:
    Type: String
  EmployeesClientId:
    Type: String
  EmployeesLoginDomain:
    Type: String
  ArtifactsBucket:
    Type: String
  ArtifactsVersion:
    Type: String

Rules:
  DomainNeedsCertificate:
    RuleCondition: !Not [!Equals [!Ref DomainName, ""]]
    Assertions:
      - Assert: !Not [!Equals [!Ref CertificateArn, ""]]
        AssertDescription: A custom domain needs an ACM certificate in us-east-1 (CertificateArn).

Conditions:
  HasDomain: !Not [!Equals [!Ref DomainName, ""]]
  HasDnsRecord: !And [!Condition HasDomain, !Not [!Equals [!Ref HostedZoneId, ""]]]
  Waf: !Equals [!Ref EnableWaf, "true"]

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudFrontReadOnly
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                "AWS:SourceArn": !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
          - Sid: TlsOnly
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt SiteBucket.Arn, !Sub "${SiteBucket.Arn}/*"]
            Condition:
              Bool: { "aws:SecureTransport": "false" }

  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "joybot-${EnvironmentName}-site"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  ApiVpcOrigin:
    Type: AWS::CloudFront::VpcOrigin
    Properties:
      VpcOriginEndpointConfig:
        Name: !Sub "joybot-${EnvironmentName}-api"
        Arn: !Ref AlbArn
        HTTPPort: 80
        HTTPSPort: 443
        OriginProtocolPolicy: http-only

  # Single-page app routing for the default (site) behavior only, so API 404s stay JSON.
  SpaRoutingFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "joybot-${EnvironmentName}-spa-routing"
      AutoPublish: true
      FunctionConfig:
        Comment: Serve index.html for client-side routes (no file extension)
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var last = request.uri.split('/').pop();
          if (last.indexOf('.') === -1) {
            request.uri = '/index.html';
          }
          return request;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Metadata:
      cfn-lint:
        config:
          ignore_checks: [W1030]   # CertificateArn is only used with a custom domain (see Rules)
    Properties:
      DistributionConfig:
        Comment: !Sub "JoyBot ${EnvironmentName}"
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        Aliases: !If [HasDomain, [!Ref DomainName], !Ref "AWS::NoValue"]
        ViewerCertificate: !If
          - HasDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        WebACLId: !If [Waf, !GetAtt WebAcl.Arn, !Ref "AWS::NoValue"]
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: api
            DomainName: !Ref AlbDnsName
            VpcOriginConfig:
              VpcOriginId: !GetAtt ApiVpcOrigin.Id
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6          # Managed-CachingOptimized
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRoutingFunction.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: false                                                # do not buffer SSE streams
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad           # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac   # Managed-AllViewerExceptHostHeader
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03

  WebAcl:
    Type: AWS::WAFv2::WebACL
    Condition: Waf
    Properties:
      Name: !Sub "joybot-${EnvironmentName}"
      Scope: CLOUDFRONT
      DefaultAction: { Allow: {} }
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub "joybot-${EnvironmentName}"
      Rules:
        - Name: api-rate-limit
          Priority: 0
          Action: { Block: {} }
          Statement:
            RateBasedStatement:
              Limit: !Ref ApiRateLimitPer5Min
              AggregateKeyType: IP
              ScopeDownStatement:
                ByteMatchStatement:
                  FieldToMatch: { UriPath: {} }
                  PositionalConstraint: STARTS_WITH
                  SearchString: /api/
                  TextTransformations: [{ Priority: 0, Type: NONE }]
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: api-rate-limit
        - Name: aws-ip-reputation
          Priority: 1
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement: { VendorName: AWS, Name: AWSManagedRulesAmazonIpReputationList }
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: aws-ip-reputation
        # Common rules everywhere except signed webhooks (Stripe payloads trip body-size rules).
        - Name: aws-common
          Priority: 2
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
              ScopeDownStatement:
                NotStatement:
                  Statement:
                    ByteMatchStatement:
                      FieldToMatch: { UriPath: {} }
                      PositionalConstraint: STARTS_WITH
                      SearchString: /api/webhooks/
                      TextTransformations: [{ Priority: 0, Type: NONE }]
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: aws-common
        - Name: aws-known-bad-inputs
          Priority: 3
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement: { VendorName: AWS, Name: AWSManagedRulesKnownBadInputsRuleSet }
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: aws-known-bad-inputs

  DnsRecordIpv4:
    Type: AWS::Route53::RecordSet
    Condition: HasDnsRecord
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 }
  DnsRecordIpv6:
    Type: AWS::Route53::RecordSet
    Condition: HasDnsRecord
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 }

  # Web assets custom resource ---------------------------------------------------------------

  WebAssetsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: deploy-site
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:${AWS::Partition}:s3:::${ArtifactsBucket}/${ArtifactsVersion}/web/*"
              - Effect: Allow
                Action: [s3:ListBucket]
                Resource: !GetAtt SiteBucket.Arn
              - Effect: Allow
                Action: [s3:PutObject, s3:DeleteObject]
                Resource: !Sub "${SiteBucket.Arn}/*"
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  WebAssetsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/joybot-${EnvironmentName}-web-assets"
      RetentionInDays: 30

  WebAssetsFunction:
    Type: AWS::Lambda::Function
    DependsOn: WebAssetsLogGroup
    Properties:
      FunctionName: !Sub "joybot-${EnvironmentName}-web-assets"
      Description: Publishes the web build and config.json to the site bucket
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: index.handler
      Timeout: 300
      MemorySize: 1024
      Role: !GetAtt WebAssetsRole.Arn
      Code:
        S3Bucket: !Ref ArtifactsBucket
        S3Key: !Sub "${ArtifactsVersion}/functions/web-assets.zip"

  WebAssets:
    Type: Custom::WebAssets
    DependsOn: SiteBucketPolicy
    Properties:
      ServiceToken: !GetAtt WebAssetsFunction.Arn
      ServiceTimeout: 300
      SourceBucket: !Ref ArtifactsBucket
      SourceKey: !Sub "${ArtifactsVersion}/web/site.zip"
      SiteBucket: !Ref SiteBucket
      DistributionId: !Ref Distribution
      Config: !Sub
        - |
          {
            "environment": "${EnvironmentName}",
            "apiBase": "/api",
            "region": "${AWS::Region}",
            "customers": { "userPoolId": "${CustomersUserPoolId}", "clientId": "${CustomersClientId}", "loginDomain": "${CustomersLoginDomain}" },
            "employees": { "userPoolId": "${EmployeesUserPoolId}", "clientId": "${EmployeesClientId}", "loginDomain": "${EmployeesLoginDomain}" },
            "appUrl": "${AppUrl}"
          }
        - AppUrl: !If [HasDomain, !Sub "https://${DomainName}", !Sub "https://${Distribution.DomainName}"]

Outputs:
  AppUrl:
    Value: !If [HasDomain, !Sub "https://${DomainName}", !Sub "https://${Distribution.DomainName}"]
  DistributionId:
    Value: !Ref Distribution
  DistributionDomainName:
    Value: !GetAtt Distribution.DomainName
  SiteBucketName:
    Value: !Ref SiteBucket
