AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  JoyBot backend (plan.md §8.3): internal Application Load Balancer (reached only by CloudFront
  through a VPC origin) and the NestJS API on the cpu capacity provider (bridge networking), plus
  the worker when its image is provided. Least-privilege task roles; database passwords injected
  from Secrets Manager.

Parameters:
  EnvironmentName:
    Type: String
    AllowedValues: [dev, staging, prod]
  VpcId:
    Type: AWS::EC2::VPC::Id
  VpcCidr:
    Type: String
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  ClusterName:
    Type: String
  CpuCapacityProvider:
    Type: String
  CpuHostSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  ApiImage:
    Type: String
    Description: API image URI (private ECR), e.g. 111122223333.dkr.ecr.us-east-1.amazonaws.com/joybot/api:v0.1.0
  WorkerImage:
    Type: String
    Default: ""
    Description: Worker image URI; empty skips the worker service.
  ApiMinTasks:
    Type: Number
    Default: 1
  ApiMaxTasks:
    Type: Number
    Default: 4
  DbHost:
    Type: String
  DbReaderHost:
    Type: String
  DbPort:
    Type: String
  AppDbSecretArn:
    Type: String
  ReaderDbSecretArn:
    Type: String
  WorkerDbSecretArn:
    Type: String
  DataKeyArn:
    Type: String
  FreshdeskSecretArn:
    Type: String
  StripeSecretArn:
    Type: String
  StripeEventsQueueArn:
    Type: String
  StripeEventsQueueUrl:
    Type: String
  CustomersUserPoolId:
    Type: String
  CustomersUserPoolArn:
    Type: String
  CustomersClientId:
    Type: String
  EmployeesUserPoolId:
    Type: String
  EmployeesUserPoolArn:
    Type: String
  EmployeesClientId:
    Type: String
  WhatsAppSettingsParameterName:
    Type: String
  SesFromAddress:
    Type: String
    Default: ""
  ModelEndpoint:
    Type: String

Conditions:
  HasWorker: !Not [!Equals [!Ref WorkerImage, ""]]
  IsProd: !Equals [!Ref EnvironmentName, prod]

Resources:
  # Load balancer --------------------------------------------------------------------------------

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: JoyBot internal ALB, HTTP from inside the VPC (CloudFront VPC origin)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: !Ref VpcCidr, Description: CloudFront VPC origin }
      SecurityGroupEgress:
        - { IpProtocol: tcp, FromPort: 32768, ToPort: 65535, CidrIp: !Ref VpcCidr, Description: Container host ports }

  HostIngressFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref CpuHostSecurityGroupId
      IpProtocol: tcp
      FromPort: 32768
      ToPort: 65535
      SourceSecurityGroupId: !Ref AlbSecurityGroup
      Description: Dynamic container ports from the ALB

  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "joybot-${EnvironmentName}-api"
      Scheme: internal
      Type: application
      Subnets: !Ref PrivateSubnetIds
      SecurityGroups: [!Ref AlbSecurityGroup]
      LoadBalancerAttributes:
        - { Key: idle_timeout.timeout_seconds, Value: "120" }   # SSE chat streams
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: "true" }
        - { Key: deletion_protection.enabled, Value: !If [IsProd, "true", "false"] }

  ApiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      TargetType: instance
      Protocol: HTTP
      Port: 80
      HealthCheckPath: /api/health
      HealthCheckPort: traffic-port
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: { HttpCode: "200" }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "60" }

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ApiTargetGroup

  # Roles ------------------------------------------------------------------------------------------

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy"
      Policies:
        - PolicyName: inject-db-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: [!Ref AppDbSecretArn, !Ref ReaderDbSecretArn, !Ref WorkerDbSecretArn]
              - Effect: Allow
                Action: kms:Decrypt
                Resource: !Ref DataKeyArn

  ApiTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: api
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: PublishWhatsAppSettings
                Effect: Allow
                Action: ssm:PutParameter
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${WhatsAppSettingsParameterName}"
              - Sid: IntegrationSecrets
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: [!Ref FreshdeskSecretArn, !Ref StripeSecretArn]
              - Effect: Allow
                Action: kms:Decrypt
                Resource: !Ref DataKeyArn
              - Sid: EnqueueStripeEvents
                Effect: Allow
                Action: sqs:SendMessage
                Resource: !Ref StripeEventsQueueArn
              - Sid: ProvisionEmployeeLogins
                Effect: Allow
                Action:
                  - cognito-idp:AdminCreateUser
                  - cognito-idp:AdminGetUser
                  - cognito-idp:AdminDisableUser
                  - cognito-idp:AdminEnableUser
                  - cognito-idp:AdminAddUserToGroup
                  - cognito-idp:AdminRemoveUserFromGroup
                  - cognito-idp:AdminUserGlobalSignOut
                Resource: !Ref EmployeesUserPoolArn
              - Sid: CustomerLoginLookup
                Effect: Allow
                Action: [cognito-idp:AdminGetUser, cognito-idp:AdminUserGlobalSignOut]
                Resource: !Ref CustomersUserPoolArn
              - Sid: WhatsAppInvites
                Effect: Allow
                Action: social-messaging:SendWhatsAppMessage
                Resource: !Sub "arn:${AWS::Partition}:social-messaging:${AWS::Region}:${AWS::AccountId}:phone-number-id/*"
              - Sid: EmailInvites
                Effect: Allow
                Action: [ses:SendEmail, ses:SendRawEmail]
                Resource: "*"
                Condition:
                  StringEquals: { "ses:FromAddress": !Ref SesFromAddress }

  # API ----------------------------------------------------------------------------------------

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/joybot/${EnvironmentName}/api"
      RetentionInDays: !If [IsProd, 365, 30]

  ApiTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "joybot-${EnvironmentName}-api"
      RequiresCompatibilities: [EC2]
      NetworkMode: bridge
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt ApiTaskRole.Arn
      RuntimePlatform: { CpuArchitecture: ARM64, OperatingSystemFamily: LINUX }
      ContainerDefinitions:
        - Name: api
          Image: !Ref ApiImage
          Essential: true
          Cpu: 512
          Memory: 1024
          MemoryReservation: 512
          StopTimeout: 120   # let SSE streams finish during deploys
          PortMappings:
            - { ContainerPort: 3000, HostPort: 0, Protocol: tcp }
          Environment:
            - { Name: NODE_ENV, Value: production }
            - { Name: PORT, Value: "3000" }
            - { Name: AUTH_MODE, Value: cognito }
            - { Name: DB_HOST, Value: !Ref DbHost }
            - { Name: DB_READER_HOST, Value: !Ref DbReaderHost }
            - { Name: DB_PORT, Value: !Ref DbPort }
            - { Name: DB_SSL, Value: "true" }
            - { Name: CUSTOMERS_USER_POOL_ID, Value: !Ref CustomersUserPoolId }
            - { Name: CUSTOMERS_CLIENT_ID, Value: !Ref CustomersClientId }
            - { Name: EMPLOYEES_USER_POOL_ID, Value: !Ref EmployeesUserPoolId }
            - { Name: EMPLOYEES_CLIENT_ID, Value: !Ref EmployeesClientId }
            - { Name: WHATSAPP_SETTINGS_PARAMETER, Value: !Ref WhatsAppSettingsParameterName }
            - { Name: MODEL_ENDPOINT, Value: !Ref ModelEndpoint }
            - { Name: FRESHDESK_SECRET_ARN, Value: !Ref FreshdeskSecretArn }
            - { Name: STRIPE_SECRET_ARN, Value: !Ref StripeSecretArn }
            - { Name: STRIPE_EVENTS_QUEUE_URL, Value: !Ref StripeEventsQueueUrl }
          Secrets:
            - { Name: APP_DB_PASSWORD, ValueFrom: !Sub "${AppDbSecretArn}:password::" }
            - { Name: READER_DB_PASSWORD, ValueFrom: !Sub "${ReaderDbSecretArn}:password::" }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ApiLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: api

  ApiService:
    Type: AWS::ECS::Service
    DependsOn: HttpListener
    Properties:
      ServiceName: api
      Cluster: !Ref ClusterName
      TaskDefinition: !Ref ApiTaskDefinition
      DesiredCount: !Ref ApiMinTasks
      CapacityProviderStrategy:
        - { CapacityProvider: !Ref CpuCapacityProvider, Weight: 1 }
      LoadBalancers:
        - { ContainerName: api, ContainerPort: 3000, TargetGroupArn: !Ref ApiTargetGroup }
      HealthCheckGracePeriodSeconds: 30
      PlacementStrategies:
        - { Type: spread, Field: "attribute:ecs.availability-zone" }
        - { Type: binpack, Field: memory }
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }

  ApiScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub "service/${ClusterName}/${ApiService.Name}"
      MinCapacity: !Ref ApiMinTasks
      MaxCapacity: !Ref ApiMaxTasks
  ApiCpuScaling:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub "joybot-${EnvironmentName}-api-cpu"
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ApiScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 60
        PredefinedMetricSpecification: { PredefinedMetricType: ECSServiceAverageCPUUtilization }
  ApiRequestScaling:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub "joybot-${EnvironmentName}-api-requests"
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ApiScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 300
        PredefinedMetricSpecification:
          PredefinedMetricType: ALBRequestCountPerTarget
          ResourceLabel: !Sub "${Alb.LoadBalancerFullName}/${ApiTargetGroup.TargetGroupFullName}"

  # Worker (Stripe reconciliation, invites, grant expiry) — when its image exists ----------------

  WorkerTaskRole:
    Type: AWS::IAM::Role
    Condition: HasWorker
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: worker
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:ChangeMessageVisibility, sqs:GetQueueAttributes]
                Resource: !Ref StripeEventsQueueArn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: [!Ref FreshdeskSecretArn, !Ref StripeSecretArn]
              - Effect: Allow
                Action: kms:Decrypt
                Resource: !Ref DataKeyArn

  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: HasWorker
    Properties:
      LogGroupName: !Sub "/joybot/${EnvironmentName}/worker"
      RetentionInDays: !If [IsProd, 365, 30]

  WorkerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Condition: HasWorker
    Properties:
      Family: !Sub "joybot-${EnvironmentName}-worker"
      RequiresCompatibilities: [EC2]
      NetworkMode: bridge
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt WorkerTaskRole.Arn
      RuntimePlatform: { CpuArchitecture: ARM64, OperatingSystemFamily: LINUX }
      ContainerDefinitions:
        - Name: worker
          Image: !Ref WorkerImage
          Essential: true
          Cpu: 256
          Memory: 512
          MemoryReservation: 256
          Environment:
            - { Name: NODE_ENV, Value: production }
            - { Name: DB_HOST, Value: !Ref DbHost }
            - { Name: DB_PORT, Value: !Ref DbPort }
            - { Name: DB_SSL, Value: "true" }
            - { Name: FRESHDESK_SECRET_ARN, Value: !Ref FreshdeskSecretArn }
            - { Name: STRIPE_SECRET_ARN, Value: !Ref StripeSecretArn }
            - { Name: STRIPE_EVENTS_QUEUE_URL, Value: !Ref StripeEventsQueueUrl }
          Secrets:
            - { Name: WORKER_DB_PASSWORD, ValueFrom: !Sub "${WorkerDbSecretArn}:password::" }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref WorkerLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: worker

  WorkerService:
    Type: AWS::ECS::Service
    Condition: HasWorker
    Properties:
      ServiceName: worker
      Cluster: !Ref ClusterName
      TaskDefinition: !Ref WorkerTaskDefinition
      DesiredCount: 1
      CapacityProviderStrategy:
        - { CapacityProvider: !Ref CpuCapacityProvider, Weight: 1 }
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }

Outputs:
  AlbArn:
    Value: !Ref Alb
  AlbDnsName:
    Value: !GetAtt Alb.DNSName
  AlbFullName:
    Value: !GetAtt Alb.LoadBalancerFullName
  ApiTargetGroupFullName:
    Value: !GetAtt ApiTargetGroup.TargetGroupFullName
  ApiServiceName:
    Value: !GetAtt ApiService.Name
  ApiLogGroupName:
    Value: !Ref ApiLogGroup
