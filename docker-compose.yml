services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: joybot_migrator
      POSTGRES_PASSWORD: migrator
      POSTGRES_DB: joybot
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U joybot_migrator -d joybot"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Settings › AI delivery through BullMQ or Redis Streams. Saved to disk (AOF) and never evicts keys:
  # BullMQ loses jobs if Redis drops them under memory pressure.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
  redisdata:
