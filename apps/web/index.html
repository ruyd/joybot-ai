<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>JoyBot</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script src="/theme-init.js"></script>
    <style>
      /* Shown until the app starts (React replaces #root's content); only appears if that is slow. */
      .boot { position: fixed; inset: 0; display: grid; place-items: center; background: #fff; animation: boot-in 300ms ease-out 400ms both; }
      .dark .boot { background: #020617; }
      .boot span { width: 40px; height: 40px; border-radius: 50%; background: conic-gradient(from 0deg, transparent 0 25%, #0878ab 100%);
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px)); mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
        animation: boot-spin 1.1s linear infinite; }
      @keyframes boot-in { from { opacity: 0; } }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot" role="status" aria-label="Loading"><span></span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
